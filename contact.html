<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Page</title>
    <link rel="stylesheet" href="styles.css"> <!-- Link your CSS stylesheet -->
    <style>
        body {
            background-color: hsl(0, 1%, 13%);
        }
        #contact {
            color: white; /* Change text color to white */
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li>
                    <a href="index.html" class="home-button" style="display: inline-block; padding: 10px 20px; background-color: #62c7e9; color: white; text-decoration: none; font-size: 18px; border-radius: 5px; text-align: center;">
                        Home
                    </a>
                </li>
            </ul>
        </nav>
    </header>
    <style>
        .home-button:hover {
            background-color: #4aaed1;
        }
    </style>

    <section id="contact">
        <h1 style="color: #62c7e9;">Contact Us</h1>
        <form action="/submit-form" method="POST">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="message">Message:</label>
            <textarea id="message" name="message" required></textarea>

            <button type="submit">Send Message</button>
        </form>
    </section>
</body>
</html>
